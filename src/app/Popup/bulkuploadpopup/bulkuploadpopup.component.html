<div class="popup-header">
    <a (click)="onCancel()"><i class="fa-solid fa-xmark"></i></a>
</div>

<div class="popup-body">
    <div class="form-container">
        <!-- Add form fields or data if required -->
    </div>
    <div class="row d-flex justify-content-center align-items-center">
        <div class="col-xl-6 col-md-6 col-lg-6">
            <label class="d-block">Bulk Upload</label>
            <!-- File upload button -->
            <input type="file" (change)="onFileUpload($event)" class="form-control" />
        </div>
        
        <div class="col-xl-6 col-md-6 col-lg-6">
            <!-- Download Excel template button -->
            <a href="/assets/client_sample_Templete.xlsx" title="download sample templet" download class="info-button"><i class="fa-solid fa-circle-info"></i></a>
        </div>
    </div>
   
    <div class="actions mt-4">
        <!-- Upload Button -->
        <button (click)="onUpload()">Upload</button> 
    </div>
</div>
